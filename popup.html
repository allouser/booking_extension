<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allo Booking Exporter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 14.5px;
      font-weight: 600;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    /* Toggle switch */
    .switch-row {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .switch-label {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #475569;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10b981;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
      transition: opacity 0.2s ease;
    }
    .btn-group.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .btn-danger {
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
    }
    .btn-danger:hover {
      background: #991b1b;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
    }
    .format-info {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .format-info strong {
      color: #f1f5f9;
      font-size: 11.5px;
    }
    .field-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .field-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #334155;
      color: #64748b;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .field-pill.active {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border-color: #0284c7;
    }
    .field-pill:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
      <div>
        <h1>Booking Exporter</h1>
      </div>
    </div>
    <span class="badge" id="status-badge">Active</span>
  </div>

  <!-- Master ON/OFF Switch -->
  <div class="switch-row">
    <span class="switch-label">
      <span id="switch-state-text">Extension Enabled</span>
    </span>
    <label class="switch">
      <input type="checkbox" id="power-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="btn-group" id="actions-group">
    <button id="btn-snip" class="btn-primary">
      <span>✂️ Select Area (Snip)</span>
      <span class="kbd">Alt + S</span>
    </button>
    <button id="btn-copy-all" class="btn-secondary">
      <span>📋 Copy All Visible Rows</span>
      <span class="kbd">Alt + A</span>
    </button>
    <button id="btn-checkbox" class="btn-secondary">
      <span>☑️ Toggle Row Checkboxes</span>
      <span>Select</span>
    </button>
    <button id="btn-stop" class="btn-danger">
      <span>⛔ Stop Ongoing Copy</span>
      <span class="kbd">Esc</span>
    </button>
  </div>

  <div class="format-info">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>🎯 Excel Fields (Uncheck to leave blank):</strong>
      <button id="btn-toggle-all-fields" style="background:transparent; border:none; color:#38bdf8; font-size:10px; font-weight:600; cursor:pointer; width:auto; padding:0;">All ON</button>
    </div>
    <div style="font-size:10px; color:#94a3b8; margin:3px 0 6px 0;">
      Unchecked fields will be left blank in Excel to keep columns aligned!
    </div>
    <div class="field-grid" id="field-grid">
      <div class="field-pill active" data-field="date">✓ DATE</div>
      <div class="field-pill active" data-field="time">✓ TIME</div>
      <div class="field-pill active" data-field="crn">✓ CRN</div>
      <div class="field-pill active" data-field="from">✓ FROM</div>
      <div class="field-pill active" data-field="to">✓ TO</div>
      <div class="field-pill active" data-field="driver">✓ DRIVER</div>
      <div class="field-pill active" data-field="user">✓ USER</div>
      <div class="field-pill active" data-field="vehicle">✓ VEHICLE</div>
      <div class="field-pill active" data-field="status">✓ STATUS</div>
      <div class="field-pill active" data-field="note">✓ NOTE</div>
      <div class="field-pill active" data-field="userMobile">✓ USER MOBILE</div>
      <div class="field-pill active" data-field="driverMobile">✓ DRIVER MOBILE</div>
    </div>
  </div>

  <!-- Remove Extra Spaces toggle -->
  <div class="switch-row">
    <span class="switch-label">
      <span>Remove Extra Spaces</span>
    </span>
    <label class="switch">
      <input type="checkbox" id="cb-remove-extra-spaces">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
